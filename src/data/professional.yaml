    description: "Served as Student Vice Chair of the IEEE Communications Society (ComSoc) chapter, organizing events and driving student engagement in communications engineering."
    category: "leadership"
    image: "images/professional/comsoc.jpg"

  - date: "Aug 2022"
    title: "Paper Accepted at ICSC 2022"
