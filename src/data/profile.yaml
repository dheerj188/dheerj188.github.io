about: |
  <p>Hi! I'm a Computer Engineering grad student at Texas A&amp;M. I work on the systems that sit underneath AI models: how work gets scheduled, where data is kept, and which machine handles what. Getting those decisions right is usually the difference between an AI system that feels fast and one that doesn't.</p>

  <p>These days most of my work is on AI agents, which behave very differently from the workloads our systems were designed for. A single agent task can run for a long time and stretch across many steps, so the usual assumptions about how to schedule and serve them stop holding.</p>

  <p>Before Texas A&amp;M I was a pre-doctoral researcher at the Indian Institute of Science, and I studied Electronics and Communication Engineering at PES University, which is where the hardware interest started. Outside of research you'll usually find me on the badminton or pickleball court, so let's rally!</p>

