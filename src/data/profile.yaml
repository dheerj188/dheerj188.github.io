about: |
  <p>Hi! I'm a Computer Engineering grad student at Texas A&M, and I spend most of my time thinking about how to make AI systems faster, smarter, more trustworthy, and more practical in the real world. I didn't start out knowing exactly what that meant &mdash; it took a lot of late nights, failed experiments, and genuinely humbling moments before I found the problems that really stuck with me.</p>

  <p>Before Texas A&M, I was a pre-doctoral researcher at the Indian Institute of Science (IISc), where I got my first real taste of what it means to do research that matters. More than any result I published, what IISc gave me was a deeper instinct for asking the right questions &mdash; and the patience to sit with hard problems long enough to actually understand them. I did my undergrad in Electronics and Communication Engineering at PES University, which is where the hardware obsession started.</p>

  <p>For the nerds: I work on integrating Gaussian Processes with LLMs to build uncertainty-aware AI that's actually scalable and deployable on resource-constrained HPC clusters &mdash; think single DGX setups. My work spans Agentic AI systems (LLM training &amp; inference), computer architecture, and probabilistic ML, trying to make all three play nicely together.</p>

  <p>Outside of research, you'll probably find me on the badminton or pickleball court. Always looking for new people to play with &mdash; let's rally!</p>

