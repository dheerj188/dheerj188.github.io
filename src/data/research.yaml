projects:
  - title: "SkipPar — Hybrid CPU-GPU LLM Training Framework"
    description: "Designed a co-execution paradigm overlapping GPU forward/backward passes with concurrent CPU parameter updates. Implemented a 4-thread producer-consumer pipeline with PyTorch DDP hooks. Achieved up to 17% reduction in end-to-end training time on A100/H100 GPUs with LLaMA-2 (10B) and GPT-2 (9B)."
    tags: ["CUDA", "PyTorch DDP", "LLM Training"]

  - title: "PAC-IPV — Prefetch-Aware Cache Replacement"
    description: "Extended an RRIP-based LLC replacement policy in ZSim with prefetch-aware RRPV assignment. Derived a probabilistic Markov-chain analytical model validated via Monte Carlo analysis (<1.5% error)."
    tags: ["C++", "ZSim", "Computer Architecture"]
    github: ""

  - title: "VAJRA — Heterogeneous GPU/FPGA Edge Cluster"
    description: "Architected a heterogeneous edge cluster (Raspberry Pi 5, Intel DE10 SoC FPGAs, NVIDIA Jetson Orin) for model-parallel DNN inference. Demonstrated 400M-parameter inference using 4 GB collective cluster memory."
    tags: ["C", "CUDA", "FPGA", "Embedded Linux"]
    github: "https://github.com/dheerj188"

  - title: "Joint Resource Allocation in Vehicular Edge Networks"
    description: "Formulated a joint MDP for resource allocation and service migration across MEC servers. Trained a modified DDPG agent achieving 26.67% reduction in service violations. Published at AIIoT 2024."
    tags: ["Python", "PyTorch", "DDPG"]
    github: "https://github.com/dheerj188"
