<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}{{ profile.name }}. {{ profile.tagline }}. MS (Thesis) student in Computer Engineering at Texas A&M University. Research in agentic AI serving systems, LLM routing, inference scheduling, and computer architecture.{% endblock %}">
    <meta name="author" content="{{ profile.name }}">
    <meta name="keywords" content="{{ profile.name }}, Dheemanth Joshi, ML Systems, Heterogeneous Computing, Probabilistic ML, Texas A&M, Computer Engineering, LLM Training, Gaussian Processes, GPU, Research">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}{{ profile.name }} | Agentic AI Systems Researcher{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ profile.name }} is an MS (Thesis) student at Texas A&M University working on ML Systems, Heterogeneous Computing, and Probabilistic ML.{% endblock %}">
    <meta property="og:url" content="https://dheerj188.github.io/">
    <meta property="og:site_name" content="{{ profile.name }}">

    <!-- Canonical -->
    <link rel="canonical" href="https://dheerj188.github.io/{% block canonical %}{% endblock %}">

    <title>{% block title %}{{ profile.name }} | Agentic AI Systems Researcher | Texas A&M{% endblock %}</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">{{ profile.name }}</a>
            <ul class="nav-links">
                <li><a href="index.html" class="{% if current_page == 'index' %}active{% endif %}">Home</a></li>
                <li><a href="academics.html" class="{% if current_page == 'academics' %}active{% endif %}">Academics</a></li>
                <li><a href="experience.html" class="{% if current_page == 'experience' %}active{% endif %}">Experience</a></li>
                <li><a href="research.html" class="{% if current_page == 'research' %}active{% endif %}">Research</a></li>
                <li><a href="professional.html" class="{% if current_page == 'professional' %}active{% endif %}">Professional</a></li>
                <li><a href="personal.html" class="{% if current_page == 'personal' %}active{% endif %}">Personal</a></li>
            </ul>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; {{ build_date.split(',')[1].strip() if build_date else '2026' }} {{ profile.name }}</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
